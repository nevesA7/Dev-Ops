name: CI/CD - Dashboard App

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

jobs:
  test:
    name: Executar Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Executar PyTest
        run: |
          pytest app/test_app.py

  build-and-push:
    name: Build e Push da Imagem Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Logar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dashboard-app:latest

  deploy:
    name: Deploy no Render e Health Check
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook no Render
        run: |
          echo "Disparando deploy no Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Aguardar Deploy e Validar Endpoint de Saúde
        run: |
          echo "Aguardando inicialização do container (cold-start)..."
          sleep 30
          HEALTH_URL="${{ secrets.APP_HEALTHCHECK_URL }}/healthz"
          
          for i in {1..10}; do
            echo "Tentativa $i de checagem em $HEALTH_URL"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Aplicação saudável e conectada ao banco!"
              exit 0
            fi
            sleep 15
          done
          
          echo "Falha na verificação de saúde da aplicação."
          exit 1
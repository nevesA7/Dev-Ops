<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Telemetria — Pipeline DevOps</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard de Telemetria e Acessos</h1>
            <p class="subtitle">Infraestrutura gerenciada na Aiven.io | Hospedado no Render</p>
        </header>

        <section class="cards-grid">
            <div class="card">
                <h3>Visitas Totais</h3>
                <div class="card-value" id="total-visits">0</div>
                <span class="card-status">Atualizado em tempo real</span>
            </div>
            <div class="card">
                <h3>Status do Banco</h3>
                <div class="card-value status-online" id="db-status">Conectando...</div>
                <span class="card-status">PostgreSQL Aiven.io</span>
            </div>
        </section>

        <section class="chart-section">
            <h2>Acessos por Minuto</h2>
            <div class="chart-container">
                <canvas id="visitsChart"></canvas>
            </div>
        </section>

        <section class="table-section">
            <h2>Últimos Acessos Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Rota / Caminho</th>
                        <th>Data e Horário</th>
                    </tr>
                </thead>
                <tbody id="recent-visits-body">
                    <tr>
                        <td colspan="3" class="loading">Carregando acessos...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        let visitsChart = null;

        function initChart() {
            const ctx = document.getElementById('visitsChart').getContext('2d');
            visitsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Acessos por Minuto',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.15)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    }
                }
            });
        }

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('total-visits').innerText = data.total_visits || 0;
                
                const dbStatus = document.getElementById('db-status');
                if (data.status === 'ok') {
                    dbStatus.innerText = "Online";
                    dbStatus.className = "card-value status-online";
                } else {
                    dbStatus.innerText = "Offline";
                    dbStatus.className = "card-value status-offline";
                }

                if (visitsChart && data.visits_per_minute) {
                    visitsChart.data.labels = data.visits_per_minute.map(item => item.minute);
                    visitsChart.data.datasets[0].data = data.visits_per_minute.map(item => item.count);
                    visitsChart.update();
                }

                const tbody = document.getElementById('recent-visits-body');
                if (data.recent_visits && data.recent_visits.length > 0) {
                    tbody.innerHTML = data.recent_visits.map(visit => `
                        <tr>
                            <td>#${visit.id}</td>
                            <td><code>${visit.path}</code></td>
                            <td>${visit.created_at}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="3">Nenhum acesso registrado ainda.</td></tr>';
                }
            } catch (error) {
                console.error("Erro ao carregar estatísticas:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchStats();
            setInterval(fetchStats, 10000);
        });
    </script>
</body>
</html>
